<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ラーフェス2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f3ea;
  --surface: #fffdf8;
  --ink: #23302a;
  --muted: #5f6b63;
  --line: #e2dccd;
  --forest: #2f5d3a;
  --forest-soft: #e3eddf;
  --wood: #9a6a35;
  --wood-soft: #f3e6d3;
  --accent: #e0702b;
  --accent-ink: #ffffff;
  --danger: #b4412f;
  --fixed: #ece6d8;
  --shadow: 0 6px 24px rgba(35, 48, 42, .12);
  --radius: 14px;
  --hour: 72px;
  --col: 168px;
  --timecol: 56px;
  --tabbar: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b18; --surface: #1f2622; --ink: #e9eee9; --muted: #a8b3ab; --line: #34403a;
    --forest: #8cc59a; --forest-soft: #24362b; --wood: #d9a86d; --wood-soft: #3a2f22;
    --accent: #f08a48; --accent-ink: #1b120b; --danger: #f08070; --fixed: #2a312c; --shadow: 0 6px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b18; --surface: #1f2622; --ink: #e9eee9; --muted: #a8b3ab; --line: #34403a;
  --forest: #8cc59a; --forest-soft: #24362b; --wood: #d9a86d; --wood-soft: #3a2f22;
  --accent: #f08a48; --accent-ink: #1b120b; --danger: #f08070; --fixed: #2a312c; --shadow: 0 6px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 15px; line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  padding-bottom: var(--tabbar);
}
h1, h2, h3, .brand { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--forest); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ヘッダー */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 16px; color: var(--forest); background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { height: 40px; width: auto; flex: none; }
.bar nav { display: flex; gap: 6px; align-items: center; }
.bar nav .nl { background: none; border: 0; min-height: 40px; padding: 0 12px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.bar nav .nl[aria-current="page"] { color: var(--forest); background: var(--forest-soft); }
.bar nav .nl { display: inline-flex; align-items: center; gap: 4px; }
.bar nav .nl svg.i { width: 18px; height: 18px; }

/* スマホ下のタブ */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: none; grid-template-columns: repeat(4, 1fr);
  background: var(--forest); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
}
.tabbar button {
  background: none; border: 0; color: rgba(255,255,255,.78); min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 10.5px; font-weight: 600; border-radius: 12px; white-space: nowrap; letter-spacing: -.02em; padding: 0 2px;
}
.tabbar button[aria-current="page"] { color: #fff; background: rgba(255,255,255,.14); }
:root[data-theme="dark"] .tabbar, :root[data-theme="dark"] .tabbar button { color: #10170f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tabbar { background: #2c4a34; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #10170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10170f; } }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn.big { min-height: 54px; font-size: 16px; width: 100%; }
.btn:disabled { opacity: .6; }
.btn:focus-visible, .tab:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.page { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
.ptitle { font-size: 22px; color: var(--forest); margin: 4px 0 2px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* トップ */
.heroimg { position: relative; aspect-ratio: 16 / 9; max-height: 52vh; width: 100%; background: linear-gradient(135deg, #2f5d3a, #9a6a35); overflow: hidden; }
.heroimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* ロゴは写真の真ん中に重ね、画面の縦横比が変わっても全体が切れないようにする */
.heroimg img.logo { position: absolute; z-index: 1; inset: 8% 10%; width: 80%; height: 84%; object-fit: contain; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .45)); }
.hero {
  max-width: 920px; margin: 0 auto; padding: 36px 16px 4px; text-align: center;
}
.hero .eyebrow { color: var(--wood); font-weight: 700; letter-spacing: .08em; font-size: clamp(20px, 6vw, 38px); line-height: 1.4; }
.hero h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.3; margin: 8px 0 12px; color: var(--forest); }
.hero .lead { color: var(--muted); margin: 10px auto 20px; max-width: 40em; line-height: 1.9; }
.hero .lead .ph, .tt .ph { display: inline-block; }
.tt .ph { white-space: nowrap; }
.hero .meta { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 8px .3em; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
/* PCでは写真を縦にも大きく出し、文字も少し大きくする（スマホは横幅で決まるので変わらない） */
@media (min-width: 900px) { .heroimg { max-height: 80vh; } .hero .lead { font-size: 17px; } .hero .meta { font-size: 17px; } }
.sect { max-width: 920px; margin: 0 auto; padding: 8px 16px 0; }
.sect h2 { font-size: 15px; color: var(--wood); margin: 12px 0 0; letter-spacing: .04em; }
.tiles { max-width: 920px; margin: 0 auto; padding: 10px 16px 8px; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 12px; min-height: 108px;
}
.tile .tt { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--forest); }
.tile .tt .ext { margin-left: auto; color: var(--muted); }
.tile .tt .ext svg { width: 16px; height: 16px; }
.tile .td { color: var(--muted); font-size: 13px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; text-wrap: pretty; }
/* 小さいスマホでもタイトルを言葉の途中で折り返さない */
.tile .tl { min-width: 0; }
.tile .tl:not(:has(.ph)) { white-space: nowrap; }
@media (max-width: 380px) { .tile .tt { font-size: 14px; gap: 5px; } .tile .td { font-size: 11.5px; } .tile .tt svg.i { width: 18px; height: 18px; } .tile .tt .ext svg { width: 14px; height: 14px; } }
@media (max-width: 340px) { .tile .tt svg.i { display: none; } }
/* 説明文はスマホで3行まで、PCでは2行まで。歩き方の説明はPCで1行に収める */
@media (max-width: 899px) { .tile .td { -webkit-line-clamp: 3; } }
/* PCは日付の下とメニューの下の余白を少し広げる */
@media (min-width: 900px) { .hero { padding-bottom: 8px; } .tiles { padding-bottom: 20px; } }
@media (min-width: 900px) { .tile .td { font-size: 12.5px; } .tile .td.nowrap { white-space: nowrap; } .tile .td.nowrap wbr { display: none; } }
.notes { max-width: 920px; margin: 0 auto; padding: 8px 16px 40px; }
.notes p { font-size: 13px; color: var(--muted); margin: 6px 0; padding-left: 1em; text-indent: -1em; }
/* メニューの説明: スマホは短い文（.sm）で2行まで、それより広い画面は元の文（.lg） */
.tile .td .sm, .tt .sp-only { display: none; }
@media (max-width: 599px) { .tt .hide-sp { display: none; } .tt .sp-only { display: inline; } .tile .td .lg { display: none; } .tile .td .sm { display: inline; } .tile .td { -webkit-line-clamp: 2; } }
/* スマホではメニューの説明とお願いの文字を少し小さく */
@media (max-width: 599px) { .tile .td { font-size: 12px; } .notes p { font-size: 12px; } }
@media (max-width: 380px) { .tile .td { font-size: 11.5px; } }
.count { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 700; color: var(--wood); }
.count b { font-family: "Zen Maru Gothic", sans-serif; font-size: 26px; }

/* タイムテーブル */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  padding: 12px 16px; max-width: 100%;
}
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tab {
  min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--forest); color: #fff; border-color: var(--forest); }
:root[data-theme="dark"] .tab[aria-selected="true"] { color: #10170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { color: #10170f; } }
.toolbar + .hint { padding: 0 16px; }
/* スマホは日付ボタン3つを横幅いっぱいに並べ、一般的な機種（幅360px〜）で横スクロールが出ないようにする */
@media (max-width: 719px) {
  .tabs { flex: 1 1 100%; gap: 4px; }
  .tab { flex: 1 1 0; min-width: 0; padding: 0 4px; font-size: 13px; letter-spacing: -.02em; }
  /* トップのメッセージは行間を詰める */
  .hero .lead { line-height: 1.6; }
}

/* 縦はページごとスクロールし、表の中は横だけ動かす（スマホで表を触るとページが下へ進めず迷うため） */
.grid-wrap { overflow-x: auto; overflow-y: hidden; margin: 0 16px 32px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
/* 会場名の行の写し。表の見出しの真上に重ねて置き、下へスクロールしてもヘッダーの下に残す。横は表に合わせて動かす */
.ghead { position: sticky; top: var(--barh, 0px); z-index: 6; height: 44px; margin: 0 17px -44px; transform: translateY(1px); overflow: hidden; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; }
.ghead .grid { will-change: transform; }
.ghead .corner { position: absolute; left: 0; top: 0; width: var(--timecol); z-index: 2; }
.grid { position: relative; display: grid; min-width: max-content; }
.grid .corner, .grid .vhead {
  position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line);
  height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; padding: 0 6px; text-align: center; line-height: 1.2;
}
.grid .corner { left: 0; z-index: 4; }
.timecol { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); }
.timecol div { height: var(--hour); font-size: 12px; color: var(--muted); text-align: right; padding: 0 6px; transform: translateY(-9px); }
.timecol div:first-child { transform: none; }
.grid .vhead, .nw { white-space: nowrap; }
/* 列幅は基本 --col。会場名が長い列（MORINO HIROBA -MATSU など）だけ名前に合わせて広がる */
.col { position: relative; border-right: 1px solid var(--line); min-width: var(--col);
  background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--hour) / 2));
}
.col:hover { background-color: color-mix(in srgb, var(--forest-soft) 40%, transparent); }
.ev {
  position: absolute; border-radius: 10px; padding: 4px 8px; overflow: hidden; text-align: left;
  border: 1px solid var(--forest); background: var(--forest-soft); color: var(--ink); font-size: 12.5px; line-height: 1.35;
  box-shadow: 0 1px 0 rgba(0,0,0,.04);
}
.ev .t { font-weight: 700; display: block; }
.ev .s { color: var(--muted); font-size: 11.5px; }
/* 場所ごとの色。--h（色相）と --s（彩度）は場所ごとに JS で入れる */
.ev, .vhead, .scard, dl.info dd { --h: 140; --s: 45%; }
.ev { border-color: hsl(var(--h) var(--s) 38%); background: hsl(var(--h) var(--s) 92%); border-left-width: 4px; }
.vhead { box-shadow: inset 0 -4px 0 hsl(var(--h) var(--s) 45%); }
.scard { border-left: 5px solid hsl(var(--h) var(--s) 45%); }
.vdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) var(--s) 45%); margin-right: 6px; vertical-align: 0; }
:root[data-theme="dark"] .ev { border-color: hsl(var(--h) var(--s) 62%); background: hsl(var(--h) calc(var(--s) * .6) 21%); }
:root[data-theme="dark"] .vhead { box-shadow: inset 0 -4px 0 hsl(var(--h) var(--s) 60%); }
:root[data-theme="dark"] .scard { border-left-color: hsl(var(--h) var(--s) 60%); }
:root[data-theme="dark"] .vdot { background: hsl(var(--h) var(--s) 60%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ev { border-color: hsl(var(--h) var(--s) 62%); background: hsl(var(--h) calc(var(--s) * .6) 21%); }
  :root:not([data-theme="light"]) .vhead { box-shadow: inset 0 -4px 0 hsl(var(--h) var(--s) 60%); }
  :root:not([data-theme="light"]) .scard { border-left-color: hsl(var(--h) var(--s) 60%); }
  :root:not([data-theme="light"]) .vdot { background: hsl(var(--h) var(--s) 60%); }
}
.band {
  position: absolute; left: var(--timecol); right: 0; z-index: 1; cursor: pointer;
  font-family: inherit; padding: 0; border-left: 0; border-right: 0; border-radius: 0;
  background: var(--fixed); opacity: .9; display: flex; align-items: center; justify-content: flex-start;
  font-size: 12px; font-weight: 700; color: var(--muted); border-top: 1px dashed var(--wood); border-bottom: 1px dashed var(--wood);
}
/* 枠の名前は左端の会場（SKY FIELD）の列の下あたりに出す */
.band span { width: var(--col); text-align: center; }
.nowline { position: absolute; left: var(--timecol); right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }

/* 日付ごとの見出し（セッション一覧） */
.group h3 { font-size: 15px; color: var(--wood); margin: 20px 0 8px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--wood-soft); color: var(--wood); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.tag.now { background: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }

/* セッション一覧 */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0 4px; }
.filters input[type=search] { flex: 1 1 220px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 16px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.filters input[type=checkbox] { width: 18px; height: 18px; }
/* 検索窓は1行使い、その下に会場のプルダウンと「終わったものも表示」 */
.filters input[type=search] { flex-basis: 100%; }
.filters select { flex: 1 1 220px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.scard {
  width: 100%; display: grid; grid-template-columns: 1fr 116px; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
}
.scard .t { font-weight: 700; font-size: 15.5px; display: block; line-height: 1.45; }
/* PCは一覧を2列で並べる（1列だと左右が空きすぎるため） */
@media (min-width: 900px) {
  .page.wide { max-width: 1080px; }
  #results .group { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  #results .group h3 { grid-column: 1 / -1; }
}
.scard .s { color: var(--muted); font-size: 13px; display: block; }
/* 主催・場所は1行で、長いときは「…」で省略する */
.scard > div:first-child { min-width: 0; }
.scard .s.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* スマホは主催・場所を小さめにして、1行に入る文字を増やす */
@media (max-width: 719px) { .scard .s { font-size: 12px; } }
.scard .w { color: var(--forest); font-weight: 700; font-size: 13px; display: block; }
.thumb { width: 116px; height: 74px; border-radius: 10px; overflow: hidden; background: var(--forest-soft); }
.thumb img, .dimg img, .sumimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.noimg { width: 100%; height: 100%; display: grid; place-items: center; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; color: #fff; font-size: 30px;
  background: linear-gradient(135deg, #2f5d3a, #6c8f4e 60%, #b9844a); }

/* マップ */
.zoombar { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
/* 指で操作する端末（スマホ・タブレット）はピンチで拡大するので、ボタンは出さない */
/* 逆に「2本指で広げると拡大」の説明は、指で操作する端末だけに出す */
.touchonly { display: none; }
@media (hover: none) and (pointer: coarse) { .zoombar { display: none; } .touchonly { display: inline; } }
.mapwrap { overflow: auto; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: calc(100vh - 200px - var(--tabbar)); }
.mapwrap img { display: block; width: 100%; height: auto; }
/* 会場名の上に重ねる押せる枠。マップ画像に対する%で置くので、拡大しても位置がずれない */
.mapinner { position: relative; }
.maphot { position: absolute; padding: 0; border: 2px solid rgba(255,255,255,.7); border-radius: 8px; background: transparent; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.maphot:hover, .maphot:focus-visible { background: rgba(255,255,255,.25); border-color: #fff; outline: none; }
.mapbox { margin-top: 6px; }
.mapbox summary { cursor: pointer; color: var(--forest); font-weight: 600; font-size: 14px; }
.mapbox .mapwrap { max-height: 50vh; margin-top: 6px; }
.mapwrap img:not([src]) { min-height: 200px; }

/* モーダル */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 28, 24, .45); }
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--shadow);
}
@media (min-width: 720px) { .modal { align-items: center; } .sheet { border-radius: 20px; padding: 24px 26px; } }
/* 詳細画面の右上の×。高さ0の帯（.xbar）を上に貼りつけ、その中に置く。下へスクロールしても右上に残り、画像の位置もずらさない */
.xbar { position: sticky; top: 0; z-index: 2; height: 0; }
/* 白い丸はやめ、半透明の暗い丸＋白い×。写真の上でも本文（白地）の上でも見える。押せる範囲は見た目より広く（::before） */
.xclose {
  position: absolute; top: -6px; right: -4px; display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0;
  border: 0; border-radius: 50%; background: rgba(20, 28, 24, .42); color: #fff;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer;
}
.xclose::before { content: ""; position: absolute; inset: -8px; }
.xclose:hover, .xclose:focus-visible { background: rgba(20, 28, 24, .6); outline: none; }
.xclose svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; }
@media (min-width: 720px) { .xclose { top: -10px; right: -12px; } }
.sheet h2 { margin: 0 0 4px; font-size: 21px; color: var(--forest); line-height: 1.4; }
.sheet .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.sheet .desc { white-space: pre-wrap; margin: 18px 0 14px; overflow-wrap: anywhere; font-size: 16px; line-height: 1.9; color: var(--ink); font-weight: 500; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
.sheet .stack { display: grid; gap: 10px; margin-top: 18px; }
.sheet .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dimg { margin: -20px -18px 16px; height: min(45vw, 240px); overflow: hidden; background: var(--forest-soft); }
@media (min-width: 720px) { .dimg { margin: -24px -26px 16px; border-radius: 20px 20px 0 0; } }
.dimg .noimg { font-size: 56px; }
dl.info { display: grid; grid-template-columns: 3.4em 1fr; gap: 6px 12px; margin: 14px 0 16px; padding: 14px 16px; background: var(--bg); border-radius: 12px; align-items: baseline; }
dl.info dt { color: var(--muted); font-weight: 600; font-size: 13px; }
dl.info dd { margin: 0; font-weight: 700; font-size: 17px; line-height: 1.5; }
dl.info dd.when { color: var(--forest); font-size: 18px; }
.sheet h2.dtitle { font-size: clamp(26px, 7vw, 32px); line-height: 1.35; margin: 2px 0 6px; overflow-wrap: anywhere; }
.dactions { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.dactions .btn.close { width: 100%; min-height: 56px; }
/* 修正・削除は閉じるより一段下げて控えめに */
.dactions .sub2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.dactions .sub2 .btn { min-height: 34px; padding: 0 12px; font-size: 12.5px; font-weight: 500; color: var(--muted); background: transparent; border-color: var(--line); opacity: .85; }
.dactions .btn.del { color: color-mix(in srgb, var(--danger) 70%, var(--muted)); border-color: color-mix(in srgb, var(--danger) 25%, var(--line)); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--forest); text-decoration: underline; font-weight: 600; font-size: 13.5px; }
.note { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }

label.f { display: block; margin: 14px 0 0; font-weight: 600; font-size: 14px; }
label.f .req { color: var(--accent); font-size: 12px; margin-left: 4px; }
label.f .opt { color: var(--muted); font-size: 12px; margin-left: 4px; font-weight: 400; }
.f input[type=text], .f select, .f textarea {
  display: block; width: 100%; margin-top: 4px; min-height: 48px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px;
}
.f textarea { min-height: 120px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-weight: 600; font-size: 14px; }
.check input { width: 20px; height: 20px; }
.picker { margin-top: 6px; }
.picker .drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 130px;
  border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--muted); font-weight: 600; cursor: pointer; font-size: 14px;
}
.picker .drop svg { width: 30px; height: 30px; }
.picker .prev { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 220px; background: var(--forest-soft); }
.picker .prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.picker .pbtns { display: flex; gap: 8px; margin-top: 8px; }
.warn { background: var(--wood-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
.err { color: var(--danger); font-weight: 600; font-size: 14px; margin-top: 10px; min-height: 1em; }

.summary { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 12px 0; }
.sumimg { width: 88px; height: 60px; border-radius: 10px; overflow: hidden; }
.summary .t { font-weight: 700; display: block; line-height: 1.45; overflow-wrap: anywhere; }
.summary > div { min-width: 0; }
.summary .s { color: var(--muted); font-size: 13px; display: block; }
.big-ok { font-size: 44px; line-height: 1; margin: 6px 0 4px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + var(--tabbar)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
/* スマホの登録ボタン。右下（下のメニューの上）に常に出す丸ボタン。PCは右上のヘッダーのボタンを使う */
.fab {
  position: fixed; right: 16px; bottom: calc(18px + var(--tabbar)); z-index: 40;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  width: 68px; height: 68px; padding: 0; border: 0; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 700; font-size: 10.5px; line-height: 1.2; text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
}
.fab svg.i { width: 18px; height: 18px; stroke-width: 2.6; }
.fab:active { transform: translateY(1px); }
.loading { text-align: center; color: var(--muted); padding: 80px 16px; }

@media (max-width: 719px) {
  :root { --col: 132px; --timecol: 44px; --tabbar: calc(64px + env(safe-area-inset-bottom)); }
  .tabbar { display: grid; }
  .fab { display: flex; }
  #app { padding-bottom: 88px; }
  .bar nav { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<script>
(function () {
  'use strict';

  // ---------- サーバーとのやりとり ----------
  // GitHub Pages など http(s) で開いたときは Apps Script の /exec に POST する（USE_API）。
  // Apps Script の画面として開いたときは google.script.run、手元でファイルを開いたときはサンプルで動く
  const API_URL = 'https://script.google.com/macros/s/AKfycbx-yUi9gUMvxiwDsFJu9poEYJyonGi9OwKNC2UkhmDphqDQtKhtt44eBp0uGXMK3u0c/exec';
  const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  const USE_API = !IS_GAS && location.protocol !== 'file:';
  const REMOTE = IS_GAS || USE_API;

  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (USE_API) {
      // text/plain にすると事前確認（CORSのpreflight）なしで送れる。Cookieは送らないので /u/2/ 問題も起きない
      return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(res => { if (!res.ok) throw new Error('通信に失敗しました（' + res.status + '）'); return res.json(); })
        .catch(e => { throw e instanceof SyntaxError || e instanceof TypeError ? new Error('通信に失敗しました。電波の良いところでもう一度お試しください。') : e; })
        .then(out => { if (!out.ok) throw new Error(out.error); return out.result; });
    }
    if (!IS_GAS) return Mock[fn].apply(null, args);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); })[fn].apply(null, args);
    });
  }

  function getParams() {
    if (!IS_GAS) return Promise.resolve(Object.fromEntries(new URLSearchParams(location.search)));
    return new Promise(function (resolve) {
      google.script.url.getLocation(function (loc) { resolve(loc.parameter || {}); });
    });
  }

  // ---------- 状態 ----------
  const VIEWS = ['top', 'calendar', 'list', 'map'];
  const state = {
    config: null, sessions: [], baseUrl: '',
    view: 'top', day: null,
    q: '', venue: '', showPast: false, zoom: 1,
  };
  const $app = document.getElementById('app');
  const $modal = document.getElementById('modal');
  const $sheet = document.getElementById('sheet');

  // ---------- 小物 ----------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toMin = t => { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); };
  const toHHMM = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const dayOf = date => state.config.days.find(d => d.date === date);
  const dayLabel = date => { const d = dayOf(date); return d ? d.label : date; };
  const venueName = s => s.venue === 'その他' ? (s.venueOther || 'その他') : s.venue;
  // 場所ごとの色。マップの雰囲気に寄せた色相。「その他」はグレー
  const VENUE_HUES = {
    'SKY FIELD': 135, 'SKY ARC': 205, 'PODCAST STUDIO': 300, 'MOON BEAR': 265,
    'TAKIBI BASE': 5, 'SAUNA RIVER': 180, 'MORINO HIROBA -MOMI': 70, 'MORINO HIROBA -MATSU': 110,
  };
  // 2025年の会場名で登録された行の読み替え。2026年のマップに無い会場は「その他」＋元の名前にする
  const VENUE_RENAME = { 'MOONBEAR DECK': 'MOON BEAR', 'Podcast Studio': 'PODCAST STUDIO' };
  const fixVenues = list => list.map(s => {
    if (!s.venue || s.venue === 'その他' || state.config.venues.indexOf(s.venue) >= 0) return s;
    if (VENUE_RENAME[s.venue]) return Object.assign({}, s, { venue: VENUE_RENAME[s.venue] });
    return Object.assign({}, s, { venue: 'その他', venueOther: s.venueOther || s.venue });
  });
  const vstyle = v => {
    if (v in VENUE_HUES) return '--h:' + VENUE_HUES[v] + ';--s:48%;';
    if (v === 'その他') return '--h:40;--s:6%;';
    // 一覧にない会場（あとから足した場合）は名前から色を決める
    let h = 0; for (const ch of String(v)) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return '--h:' + h + ';--s:40%;';

  const ASSET_VER = '20261029';
  const assetCache = {};
  function assetUrl(name) {
    // 画像を差し替えたら ASSET_VER を変える（ブラウザに古い画像が残らないように）
    if (!IS_GAS) return Promise.resolve('assets/' + name + (name === 'logo' ? '.png' : '.jpg') + '?v=' + ASSET_VER);

  // セッションの画像。公開リンクで出し、出せなければ getImage で読み直す
  const imageCache = {};
  function sessionImageUrl(id) {
    if (!REMOTE) return call('getImage', id);
    if (imageCache[id]) return Promise.resolve(imageCache[id]);
    return Promise.resolve('https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000');
  }
  function hydrateImages(root) {
    (root || document).querySelectorAll('img[data-img]').forEach(img => {
      const id = img.getAttribute('data-img');
      img.removeAttribute('data-img');
      img.addEventListener('error', function retry() {
        img.removeEventListener('error', retry);
        if (!REMOTE) return;
        call('getImage', id).then(src => { imageCache[id] = src; img.src = src; }).catch(() => {});
      });
      sessionImageUrl(id).then(src => { img.src = src; }).catch(() => {});

  // 選んだ写真を長辺1200pxのJPEGにする（通信量を減らし、スマホの大きな写真でも送れるように）
  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('画像を読み込めませんでした。'));
      reader.onload = () => {
        const im = new Image();
        im.onerror = () => reject(new Error('この画像は使えませんでした。別の画像でお試しください。'));
        im.onload = () => {
          const max = REMOTE ? 1200 : 700;
          const r = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        im.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function gridHtml() {
    const c = state.config;
    const day = dayOf(state.day);
    const startMin = Math.floor(toMin(day.start) / 60) * 60;
    const endMin = Math.ceil(toMin(day.end) / 60) * 60;
    const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 72;
    const px = m => (m - startMin) / 60 * hourPx;
    const height = px(endMin);
    const items = state.sessions.filter(s => s.date === state.day);

    let head = '<div class="ghead" id="gridHead" aria-hidden="true"><div class="grid"><div class="corner"></div>';
    c.venues.forEach(v => { head += '<div class="vhead" style="' + vstyle(v) + '">' + esc(v) + '</div>'; });
    head += '</div></div>';
    let html = head + '<div class="grid-wrap" id="gridWrap"><div class="grid" style="grid-template-columns: var(--timecol) repeat(' + c.venues.length + ', minmax(var(--col), max-content));">';
    html += '<div class="corner"></div>';
    c.venues.forEach(v => { html += '<div class="vhead" style="' + vstyle(v) + '">' + esc(v) + '</div>'; });

    html += '<div class="timecol" style="height:' + height + 'px">';
    for (let m = startMin; m < endMin; m += 60) html += '<div>' + toHHMM(m) + '</div>';
    html += '</div>';

    c.venues.forEach(v => {
      const evs = layoutLanes(items.filter(s => s.venue === v));
      html += '<div class="col" data-venue="' + esc(v) + '" style="height:' + height + 'px">';
      evs.forEach(e => {
        const s = e.s;
        const top = px(toMin(s.start)), h = Math.max(px(toMin(s.end)) - top - 2, 22);
        const w = 100 / e.lanes;
        html += '<button type="button" class="ev" data-id="' + esc(s.id) + '" style="' + vstyle(s.venue) + 'top:' + (top + 1) + 'px;height:' + h + 'px;left:calc(' + (e.lane * w) + '% + 3px);width:calc(' + w + '% - 6px)">' +
          '<span class="t">' + esc(s.title) + '</span><span class="s">' + esc(s.start) + '–' + esc(s.end) + '・' + esc(s.host) + (s.venue === 'その他' ? '・' + esc(s.venueOther) : '') + '</span></button>';
      });
      html += '</div>';
    });

    // 事務局の基本枠（全会場にかかる帯）
    c.fixed.filter(f => f.date === state.day).forEach(f => {
      html += '<button type="button" class="band" data-fixed="' + c.fixed.indexOf(f) + '" style="top:' + (44 + px(toMin(f.start))) + 'px;height:' + (px(toMin(f.end)) - px(toMin(f.start))) + 'px"><span>' + esc(f.title) + '</span></button>';
    });

    if (state.day === todayStr()) {
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      if (m >= startMin && m <= endMin) html += '<div class="nowline" style="top:' + (44 + px(m)) + 'px"></div>';
    }
    html += '</div></div>';
    return html;
  }

  // 同じ会場で時間が重なるセッションを横に並べる
  function layoutLanes(list) {
    const sorted = list.slice().sort((a, b) => toMin(a.start) - toMin(b.start) || toMin(b.end) - toMin(a.end));
    const out = [];
    let cluster = [], clusterEnd = -1;
    const flush = () => {
      const laneEnds = [];
      cluster.forEach(e => {
        let i = laneEnds.findIndex(end => end <= toMin(e.s.start));
        if (i < 0) { i = laneEnds.length; laneEnds.push(0); }
        laneEnds[i] = toMin(e.s.end); e.lane = i;
      });
      cluster.forEach(e => { e.lanes = laneEnds.length; out.push(e); });
      cluster = []; clusterEnd = -1;
    };
    sorted.forEach(s => {
      if (cluster.length && toMin(s.start) >= clusterEnd) flush();
      cluster.push({ s: s }); clusterEnd = Math.max(clusterEnd, toMin(s.end));
    });
    if (cluster.length) flush();
    return out;
  }

  // 会場名の行の写しを、表の列幅と横スクロールに合わせる

    const wrap = document.getElementById('gridWrap'), head = document.getElementById('gridHead');

    const bar = document.querySelector('.bar');
    document.documentElement.style.setProperty('--barh', (bar ? bar.offsetHeight : 0) + 'px');
    const inner = head.querySelector('.grid');
    const widths = Array.prototype.map.call(wrap.querySelectorAll('.grid > .corner, .grid > .vhead'), el => el.getBoundingClientRect().width + 'px');
    inner.style.gridTemplateColumns = widths.join(' ');
    const move = () => { inner.style.transform = 'translateX(' + (-wrap.scrollLeft) + 'px)'; };
    if (!wrap.dataset.synced) { wrap.dataset.synced = '1'; wrap.addEventListener('scroll', move, { passive: true }); }
    move();
  }

  function renderResults() {

    const fixed = state.config.fixed.filter(f => !f.notSession).map(f => Object.assign({ fixedIndex: state.config.fixed.indexOf(f) }, f));
    const list = state.sessions.concat(fixed).sort(byTime)
      .filter(s => state.showPast || endKey(s) > now)
      .filter(s => !state.venue || s.venue === state.venue)

      return;

    };
    const live = list.filter(s => startKey(s) <= now && now < endKey(s));
    const rest = list.filter(s => live.indexOf(s) < 0);
    let html = '';
    if (live.length) html += '<div class="group"><h3>いま開催中</h3>' + live.map(card).join('') + '</div>';

  // inForm: 登録フォームの中のマップ。押すと「開催場所」をその会場にする（地図の画面では、その会場のセッション一覧へ）
  function mapHtml(inForm) {
    const spots = Object.keys(MAP_SPOTS).filter(v => state.config.venues.indexOf(v) >= 0).map(v => {
      const p = MAP_SPOTS[v];
      return '<button type="button" class="maphot" data-mapvenue="' + esc(v) + '" style="left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + '%;height:' + p[3] + '%" aria-label="' + esc(v) + (inForm ? 'を開催場所にする' : 'のセッションを見る') + '"></button>';
    }).join('');
    return '<div class="mapwrap"><div class="mapinner" style="width:' + (state.zoom * 100) + '%"><img id="mapImg" alt="ライジングフィールド軽井沢の場内マップ。SKY FIELD、SKY ARC、PODCAST STUDIO、MOON BEAR、TAKIBI BASE、SAUNA RIVER、MORINO HIROBA -MOMI・-MATSU の位置">' + spots + '</div></div>';
  }

  function renderMap() {
    $app.innerHTML =
      '<div class="page">' +
        '<h2 class="ptitle">場内マップ</h2>' +
        '<p class="hint">ライジングフィールド内のマップです。<br>白い枠の会場名を押すと、その会場のセッションが見られます。<span class="touchonly"><br>2本指で広げると拡大できます。</span></p>' +
        '<div class="zoombar">' +
          '<button class="btn small" type="button" data-zoom="-1" aria-label="小さく">－ 小さく</button>' +
          '<button class="btn small" type="button" data-zoom="1" aria-label="大きく">＋ 大きく</button>' +
        '</div>' +
        mapHtml() +

  // ---------- モーダル ----------
  function openModal(html) {
    $sheet.innerHTML = html;
    $modal.hidden = false;
    $sheet.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    hydrateImages($sheet);
    const f = $sheet.querySelector('h2');
    if (f) { f.setAttribute('tabindex', '-1'); f.focus({ preventScroll: true }); }
  }
  function closeModal() {
    if ($modal.hidden) return;
    $modal.hidden = true; $sheet.innerHTML = '';
    document.body.style.overflow = '';
  }

  function summaryHtml(s) {
    return '<div class="summary"><div class="sumimg">' + imgHtml(s) + '</div><div>' +
      '<span class="t">' + esc(s.title) + '</span>' +
      '<span class="s">' + esc(s.host) + '</span>' +
      '<span class="s">' + esc(dayLabel(s.date)) + ' ' + esc(s.start) + '–' + esc(s.end) + '・' + '<span class="nw">' + esc(venueName(s)) + '</span>' + '</span>' +
      '</div></div>';
  }

  // 詳細画面の右上に置く×（下の「閉じる」と同じ動き）
  const XCLOSE = '<div class="xbar"><button type="button" class="xclose" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';

  // セッション詳細：修正・削除はここから誰でもできる
  function showDetail(id) {
    const s = state.sessions.find(x => x.id === id);
    if (!s) { toast('このセッションは見つかりませんでした'); return; }
    openModal(
      XCLOSE +
      '<div class="dimg">' + imgHtml(s) + '</div>' +
      '<h2 class="dtitle">' + esc(s.title) + '</h2>' +
      '<dl class="info">' +
        '<dt>日時</dt><dd class="when">' + esc(dayLabel(s.date)) + ' ' + esc(s.start) + '〜' + esc(s.end) + '</dd>' +
        '<dt>場所</dt><dd style="' + vstyle(s.venue) + '"><span style="white-space:nowrap"><span class="vdot" aria-hidden="true"></span>' + esc(venueName(s)) + '</span>　<button type="button" class="linkbtn" data-go="map">マップで見る</button></dd>' +
        '<dt>主催</dt><dd>' + esc(s.host) + '</dd>' +
      '</dl>' +
      '<div class="desc">' + esc(s.description) + '</div>' +
      '<p class="note">このセッションのURLを <button type="button" class="linkbtn" data-share="' + esc(s.id) + '">コピー</button> して、FBグループで告知できます。</p>' +
      '<div class="dactions">' +
        '<button class="btn close" type="button" data-close>閉じる</button>' +
        '<div class="sub2">' +
          '<button class="btn" type="button" data-edit="' + esc(s.id) + '">修正する</button>' +
          '<button class="btn del" type="button" data-del="' + esc(s.id) + '">削除する</button>' +
        '</div>' +
      '</div>'
    );
  }

  // 事務局の基本枠の詳細：読むだけ（修正・削除・URLコピーは出さない）
  function showFixed(i) {
    const f = state.config.fixed[i];
    if (!f) return;
    openModal(
      XCLOSE +
      (f.imageId || f.imageFile ? '<div class="dimg">' + imgHtml(f) + '</div>' : '') +
      '<h2 class="dtitle">' + esc(f.title) + '</h2>' +
      '<dl class="info">' +
        '<dt>日時</dt><dd class="when">' + esc(dayLabel(f.date)) + ' ' + esc(f.start) + '〜' + esc(f.end) + '</dd>' +
        '<dt>場所</dt>' + (f.venue
          ? '<dd style="' + vstyle(f.venue) + '"><span style="white-space:nowrap"><span class="vdot" aria-hidden="true"></span>' + esc(venueName(f)) + '</span>　<button type="button" class="linkbtn" data-go="map">マップで見る</button></dd>'
          : '<dd>ー</dd>') +
        (f.host ? '<dt>主催</dt><dd>' + esc(f.host) + '</dd>' : '') +
      '</dl>' +
      (f.description ? '<div class="desc">' + esc(f.description) + '</div>' : '') +
      '<p class="note">事務局が用意する全体の枠です。この時間にはセッションを登録できません。</p>' +
      '<div class="dactions"><button class="btn close" type="button" data-close>閉じる</button></div>'
    );
  }

  // 削除は2回確認する（1回目: 内容の確認、2回目: 本当に削除するか）
  function confirmDelete(id, final) {
    const s = state.sessions.find(x => x.id === id);
    if (!s) return;
    openModal(
      (final ? '<h2>本当に削除しますか？</h2>' : '<h2>このセッションを削除しますか？</h2>') +
      summaryHtml(s) +
      (final ? '<p class="sub">「削除する」を押すと、すぐにタイムテーブルと一覧から消えます。</p>' : '<p class="sub">削除すると、タイムテーブルと一覧から消えます。</p>') +
      '<div class="err" id="ferr" role="alert"></div>' +
      '<div class="stack">' +
        '<button class="btn danger solid big" type="button" id="delOk">削除する</button>' +
        '<button class="btn" type="button" data-id="' + esc(s.id) + '">やめる</button>' +
      '</div>'
    );
    const btn = document.getElementById('delOk');
    btn.addEventListener('click', () => {
      if (!final) return confirmDelete(id, true);
      btn.disabled = true; btn.textContent = '削除中…';
      call('deleteSession', id)
        .then(() => reload()).then(() => {
          render();
          openModal(
            '<div class="big-ok" aria-hidden="true">🗑️</div><h2>削除しました</h2>' +
            '<p class="sub">間違えて消してしまったときは、事務局に連絡してください。元に戻せます。</p>' +
            '<div class="stack"><button class="btn primary" type="button" data-close>OK</button></div>'
          );
        })
        .catch(e => { document.getElementById('ferr').textContent = e.message; btn.disabled = false; btn.textContent = '削除する'; });
    });
  }

  // 事務局の基本枠（開場・受付、オープニング、クロージング）。この時間にはセッションを入れられない
  const fixedOf = date => state.config.fixed.filter(f => f.date === date);
  const fixedHit = (date, a, b) => fixedOf(date).find(f => toMin(f.start) < b && a < toMin(f.end));
  // 開始 m が基本枠の中なら、枠の終わりまでずらす
  function skipFixed(date, m) {
    let f;
    while ((f = fixedOf(date).find(x => toMin(x.start) <= m && m < toMin(x.end)))) m = toMin(f.end);
    return m;
  }
  // 開始から length 分の終了。次の基本枠や、その日の終わりを越えないようにする
  function endFor(day, startMin, length) {
    const next = fixedOf(day.date).map(f => toMin(f.start)).filter(m => m > startMin);
    return Math.min(startMin + length, toMin(day.end), ...next);
  }

  function timeOptions(day, selected, isEnd) {
    const step = state.config.slotMinutes;
    let html = '';
    for (let m = toMin(day.start) + (isEnd ? step : 0); m <= toMin(day.end) - (isEnd ? 0 : step); m += step) {
      const t = toHHMM(m);
      // 基本枠の中の時刻は選択肢に出さない
      const inFixed = fixedOf(day.date).some(x => isEnd ? (toMin(x.start) < m && m <= toMin(x.end)) : (toMin(x.start) <= m && m < toMin(x.end)));
      if (inFixed) continue;
      html += '<option value="' + t + '"' + (t === selected ? ' selected' : '') + '>' + t + '</option>';
    }
    return html;
  }

  // 登録と修正で同じフォームを使う。edit があれば修正
  function showForm(preset, edit) {
    const c = state.config;
    // 日にちの初期値は今日で決める。会期前は初日、会期中はその日、会期後は最終日
    const today = dayOf(todayStr()) ? todayStr() : '';
    const first = c.days[0].date, last = c.days[c.days.length - 1].date;
    const defaultDate = todayStr() < first ? first : todayStr() > last ? last : (today || first);
    const s = Object.assign({ title: '', host: '', date: defaultDate, start: '', end: '', venue: '', venueOther: '', description: '', imageId: '' }, preset || {});
    let day = dayOf(s.date) || c.days[0];
    if (!s.start) {
      // 開始の初期値は、いまの次のきりの良い時刻（30分刻み。14:45なら15:00、14:10なら14:30）
      const now = new Date();
      let next = Math.ceil((now.getHours() * 60 + now.getMinutes() + 1) / 30) * 30;
      // 会期中で、その日の受付時間がもう終わっていたら翌日の最初にする
      if (s.date === today && next > toMin(day.end) - 60) {
        const tomorrow = c.days[c.days.indexOf(day) + 1];
        if (tomorrow) { day = tomorrow; s.date = day.date; next = toMin(day.start); }
      }
      s.start = toHHMM(Math.max(toMin(day.start), Math.min(next, toMin(day.end) - 60)));
    }
    if (!edit) {
      // 開始が基本枠の中なら枠の後ろへ。後ろに空きがなければ、その日の最初の空きにする
      let m = skipFixed(s.date, toMin(s.start));
      if (m >= toMin(day.end)) m = skipFixed(s.date, toMin(day.start));
      if (toHHMM(m) !== s.start) { s.start = toHHMM(m); s.end = ''; }
      if (s.end && fixedHit(s.date, toMin(s.start), toMin(s.end))) s.end = '';
    }
    if (!s.end) s.end = toHHMM(endFor(day, toMin(s.start), 60));
    // 画像: keep=そのまま / new=差し替え / remove=外す
    const img = { mode: 'keep', data: null };

    openModal(
      '<h2>' + (edit ? 'セッションを修正する' : 'セッションを登録する') + '</h2>' +
      '<p class="sub">' + (edit ? '直したいところを変えて、いちばん下の「更新する」を押してください。' : 'ログインは要りません。登録するとすぐタイムテーブルに載ります。') + '</p>' +
      '<form id="sform" novalidate>' +
        '<label class="f">セッション名<span class="req">必須</span><input type="text" name="title" maxlength="80" value="' + esc(s.title) + '" placeholder="例：焚き火を囲んで、問いを持ち寄る"></label>' +
        '<label class="f">お名前<span class="req">必須</span><input type="text" name="host" maxlength="60" value="' + esc(s.host) + '" autocomplete="name" placeholder="例：軽井沢 花子"></label>' +
        '<label class="f">開催場所<span class="req">必須</span><select name="venue"><option value="">選んでください</option>' + c.venues.map(v => '<option' + (v === s.venue ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>' +
        '<details class="mapbox" id="formMap"><summary>場所はマップで確認できます（ここを押すと開きます。会場名を押すとその場所を選べます）</summary>' + mapHtml(true) + '</details>' +
        '<label class="f" id="otherWrap"' + (s.venue === 'その他' ? '' : ' hidden') + '>場所（その他）<span class="req">必須</span><input type="text" name="venueOther" maxlength="40" value="' + esc(s.venueOther) + '" placeholder="例：受付前の芝生"></label>' +
        '<label class="f">セッション内容<span class="req">必須</span><textarea name="description" maxlength="1000" placeholder="やること、持ち物、どんな人に来てほしいか など">' + esc(s.description) + '</textarea></label>' +
        '<label class="f">日にち<span class="req">必須</span><select name="date">' + c.days.map(d => '<option value="' + d.date + '"' + (d.date === s.date ? ' selected' : '') + '>' + esc(d.label) + '</option>').join('') + '</select></label>' +
        '<div class="two">' +
          '<label class="f">開始時間<span class="req">必須</span><select name="start">' + timeOptions(day, s.start, false) + '</select></label>' +
          '<label class="f">終了時間<span class="req">必須</span><select name="end">' + timeOptions(day, s.end, true) + '</select></label>' +
        '</div>' +
        '<div class="f" style="margin-top:14px;font-weight:600;font-size:14px">セッションのイメージ画像<span class="opt">（なくてもOK）</span>' +
          '<div class="picker" id="picker"></div>' +
          '<input type="file" accept="image/*" id="file" hidden>' +
        '</div>' +
        '<div id="warn"></div>' +
        '<div class="err" id="ferr" role="alert"></div>' +
        '<div class="stack">' +
          '<button class="btn accent big" type="submit" id="saveBtn">' + (edit ? 'この内容で更新する' : 'セッションを登録する') + '</button>' +
          '<button class="btn" type="button" ' + (edit ? 'data-id="' + esc(edit.id) + '"' : 'data-close') + '>やめる</button>' +
        '</div>' +
      '</form>'
    );

    const form = document.getElementById('sform');
    const $file = document.getElementById('file');
    const $picker = document.getElementById('picker');
    const hadImage = !!s.imageId;
    const drawPicker = () => {
      const has = img.mode === 'new' || (img.mode === 'keep' && hadImage);
      if (!has) {
        $picker.innerHTML = '<button type="button" class="drop" id="pick" style="width:100%">' + ICON_PHOTO + '写真を選ぶ</button>';
      } else {
        $picker.innerHTML = '<div class="prev">' + (img.mode === 'new' ? '<img src="' + img.data + '" alt="選んだ画像">' : '<img data-img="' + esc(s.imageId) + '" alt="いまの画像">') + '</div>' +
          '<div class="pbtns"><button type="button" class="btn small" id="pick">別の写真にする</button><button type="button" class="btn small danger" id="unpick">画像を外す</button></div>';
        hydrateImages($picker);
      }
      document.getElementById('pick').addEventListener('click', () => $file.click());
      const un = document.getElementById('unpick');
      if (un) un.addEventListener('click', () => { img.mode = hadImage ? 'remove' : 'keep'; img.data = null; drawPicker(); });
    };
    drawPicker();
    $file.addEventListener('change', () => {
      const f = $file.files && $file.files[0];
      $file.value = '';
      if (!f) return;
      $picker.innerHTML = '<div class="drop">画像を準備しています…</div>';
      shrinkImage(f).then(data => { img.mode = 'new'; img.data = data; drawPicker(); })
        .catch(e => { document.getElementById('ferr').textContent = e.message; drawPicker(); });
    });

    document.getElementById('formMap').addEventListener('toggle', function () {
      if (this.open) loadAsset(this.querySelector('img'), 'map');
    });

    // 開始を動かしたら、長さを保ったまま終了もずらす
    let lastStart = form.start.value;
    const refreshTimes = () => {
      const d = dayOf(form.date.value), st = form.start.value;
      const length = Math.max(toMin(form.end.value) - toMin(lastStart), state.config.slotMinutes) || 60;
      form.start.innerHTML = timeOptions(d, st, false);
      if (!form.start.value) form.start.selectedIndex = 0;
      const want = toHHMM(endFor(d, toMin(form.start.value), length));
      form.end.innerHTML = timeOptions(d, want, true);
      lastStart = form.start.value;
    };
    const checkOverlap = () => {
      const v = form.venue.value, d = form.date.value, a = toMin(form.start.value), b = toMin(form.end.value);
      const fixed = fixedHit(d, a, b);
      if (fixed) {
        document.getElementById('warn').innerHTML = '<div class="warn">「' + esc(fixed.title) + '」（' + esc(fixed.start) + '〜' + esc(fixed.end) + '）の時間にはセッションを入れられません。時間を変えてください。</div>';
        return;
      }
      const hits = v && v !== 'その他' ? state.sessions.filter(x => x.venue === v && x.date === d && (!edit || x.id !== edit.id) && toMin(x.start) < b && a < toMin(x.end)) : [];
      document.getElementById('warn').innerHTML = hits.length
        ? '<div class="warn">同じ場所・時間に「' + hits.map(h => esc(h.title)).join('」「') + '」があります。このまま登録もできます。当日はお互いにスペースを調整してください。</div>' : '';
    };
    form.date.addEventListener('change', () => { refreshTimes(); checkOverlap(); });
    form.start.addEventListener('change', () => { refreshTimes(); checkOverlap(); });
    form.end.addEventListener('change', checkOverlap);
    form.venue.addEventListener('change', () => { document.getElementById('otherWrap').hidden = form.venue.value !== 'その他'; checkOverlap(); });
    checkOverlap();

    form.addEventListener('submit', ev => {
      ev.preventDefault();
      const data = {
        title: form.title.value, host: form.host.value, date: form.date.value,
        start: form.start.value, end: form.end.value, venue: form.venue.value,
        venueOther: form.venueOther.value, description: form.description.value,
      };
      const err = document.getElementById('ferr');
      const stop = (msg, el) => { err.textContent = msg; el.focus(); };
      if (!data.title.trim()) return stop('セッション名を入れてください。', form.title);
      if (!data.host.trim()) return stop('お名前を入れてください。', form.host);
      if (!data.venue) return stop('開催場所を選んでください。', form.venue);
      if (data.venue === 'その他' && !data.venueOther.trim()) return stop('「その他」の場所を書いてください。', form.venueOther);
      if (!data.description.trim()) return stop('セッション内容を書いてください。', form.description);
      const fixed = fixedHit(data.date, toMin(data.start), toMin(data.end));
      if (fixed) return stop('「' + fixed.title + '」（' + fixed.start + '〜' + fixed.end + '）の時間にはセッションを入れられません。時間を変えてください。', form.start);
      err.textContent = '';
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = edit ? '更新中…' : '登録中…';
      const imageArg = img.mode === 'new' ? img.data : (img.mode === 'remove' ? '' : null);
      const p = edit
        ? call('updateSession', edit.id, data, imageArg, edit.updatedAt)
        : call('createSession', data, img.mode === 'new' ? img.data : '');
      p.then(saved => reload().then(() => {
        state.day = data.date;
        render();
        openModal(
          '<div class="big-ok" aria-hidden="true">🎉</div>' +
          '<h2>' + (edit ? '更新しました' : '登録しました！') + '</h2>' +
          '<p class="sub">' + (edit ? '新しい内容がタイムテーブルに反映されました。' : 'タイムテーブルに載りました。あとで直したいときは、このセッションを開いて「修正する」を押してください。') + '</p>' +
          summaryHtml(saved) +
          '<div class="stack">' +
            '<button class="btn primary" type="button" data-go="calendar">タイムテーブルで見る</button>' +
            '<button class="btn" type="button" data-close>閉じる</button>' +
          '</div>'
        );
      })).catch(e => {
        err.textContent = e.message || '送信できませんでした。';
        btn.disabled = false; btn.textContent = edit ? 'この内容で更新する' : 'セッションを登録する';
      });
    });
  }

  function reload() {
    return call('getSessions').then(list => { state.sessions = fixVenues(list); });
  }

  // ---------- マップの拡大縮小（2本指のピンチ・PCは Ctrl＋ホイール／トラックパッド） ----------
  // 1本指の移動はブラウザのスクロールに任せる。ページ全体の拡大は .mapwrap の touch-action で止めている
  const ZOOM_MIN = 1, ZOOM_MAX = 4;
  let pinch = null, pinchEnd = 0;
  // 指の位置（cx, cy）の下にある地点が動かないように拡大する
  function setZoom(wrap, z, cx, cy) {
    const inner = wrap.querySelector('.mapinner');
    if (!inner) return;
    z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
    const r = wrap.getBoundingClientRect();
    const ox = cx - r.left, oy = cy - r.top;
    const k = z / state.zoom;
    const px = (wrap.scrollLeft + ox) * k, py = (wrap.scrollTop + oy) * k;
    state.zoom = z;
    document.querySelectorAll('.mapinner').forEach(m => { m.style.width = (z * 100) + '%'; });
    wrap.scrollLeft = px - ox;
    wrap.scrollTop = py - oy;
  }
  const touchDist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  document.addEventListener('touchstart', e => {
    const wrap = e.target.closest && e.target.closest('.mapwrap');
    if (wrap && e.touches.length === 2) pinch = { wrap: wrap, d0: touchDist(e.touches), z0: state.zoom };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const ts = e.touches;
    setZoom(pinch.wrap, pinch.z0 * touchDist(ts) / pinch.d0, (ts[0].clientX + ts[1].clientX) / 2, (ts[0].clientY + ts[1].clientY) / 2);
  }, { passive: false });
  document.addEventListener('touchend', e => {
    if (pinch && e.touches.length < 2) { pinch = null; pinchEnd = Date.now(); }
  });
  // iPhone の Safari はピンチでページごと拡大しようとするので止める
  document.addEventListener('gesturestart', e => { if (e.target.closest && e.target.closest('.mapwrap')) e.preventDefault(); });
  document.addEventListener('wheel', e => {
    const wrap = e.ctrlKey && e.target.closest && e.target.closest('.mapwrap');
    if (!wrap) return;
    e.preventDefault();
    setZoom(wrap, state.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  }, { passive: false });

  // ---------- 操作 ----------
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-go],[data-new],[data-day],[data-id],[data-close],[data-edit],[data-del],[data-share],[data-zoom],[data-fixed],[data-mapvenue],.col');
    if (!t) { if (ev.target === $modal) closeModal(); return; }
    if (t.hasAttribute('data-mapvenue')) {
      if (Date.now() - pinchEnd < 400) return; // ピンチの指を離したときの誤タップは無視
      const v = t.getAttribute('data-mapvenue');
      const box = t.closest('#formMap');
      if (box) {
        // 登録フォームの中: 開催場所を選んでマップを閉じる
        const sel = box.parentNode.querySelector('select[name="venue"]');
        if (sel) { sel.value = v; sel.dispatchEvent(new Event('change', { bubbles: true })); sel.focus(); }
        box.open = false;
        return;
      }
      state.venue = v;
      return go('list');
    }
    if (t.hasAttribute('data-close')) return closeModal();
    if (t.hasAttribute('data-go')) return go(t.getAttribute('data-go'));
    if (t.hasAttribute('data-new')) return showForm();
    if (t.hasAttribute('data-day')) { state.day = t.getAttribute('data-day'); return render(); }
    if (t.hasAttribute('data-id')) return showDetail(t.getAttribute('data-id'));
    if (t.hasAttribute('data-fixed')) return showFixed(Number(t.getAttribute('data-fixed')));
    if (t.hasAttribute('data-edit')) {
      const s = state.sessions.find(x => x.id === t.getAttribute('data-edit'));
      if (s) showForm(s, { id: s.id, updatedAt: s.updatedAt });
      return;
    }
    if (t.hasAttribute('data-del')) return confirmDelete(t.getAttribute('data-del'));
    if (t.hasAttribute('data-share')) return copyText(state.baseUrl + '?s=' + encodeURIComponent(t.getAttribute('data-share')));
    if (t.hasAttribute('data-zoom')) {
      const wrap = document.querySelector('.page .mapwrap');
      if (wrap) { const r = wrap.getBoundingClientRect(); setZoom(wrap, state.zoom + Number(t.getAttribute('data-zoom')) * 0.5, r.left + r.width / 2, r.top + r.height / 2); }
      return;
    }
    if (t.classList.contains('col')) {
      // 空いているところを押したら、その会場・時刻で登録フォームを開く
      const rect = t.getBoundingClientRect();
      const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 72;
      const day = dayOf(state.day);
      const startMin = Math.floor(toMin(day.start) / 60) * 60;
      let m = startMin + Math.floor((ev.clientY - rect.top) / hourPx * 60 / 30) * 30;
      m = Math.max(toMin(day.start), Math.min(m, toMin(day.end) - state.config.slotMinutes));
      showForm({ venue: t.getAttribute('data-venue'), date: state.day, start: toHHMM(m), end: toHHMM(Math.min(m + 60, toMin(day.end))) });
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$modal.hidden) closeModal(); });

  // ---------- 起動（ファイルの最後で呼ぶ） ----------
  function start() {
    Promise.all([call('getBootstrap'), getParams()]).then(([boot, params]) => {
      state.config = boot.config; state.sessions = fixVenues(boot.sessions);
      // 共有リンクは、いま開いている画面のURLを基準にする（GitHub Pages なら github.io のURL）
      state.baseUrl = USE_API ? location.href.split(/[?#]/)[0] : boot.baseUrl;
      const hash = IS_GAS ? '' : location.hash.slice(1);
      state.view = VIEWS.indexOf(params.page || hash) >= 0 ? (params.page || hash) : 'top';
      render();
      // ?s=セッションID で、そのセッションの詳細を開く（告知用のリンク）
      if (params.s) {
        const s = state.sessions.find(x => x.id === params.s);
        if (s) { state.day = s.date; if (state.view === 'top') { state.view = 'calendar'; render(); } showDetail(s.id); }
        else toast('このセッションは見つかりませんでした');
      }
      // 開いたままの画面も、ときどき最新にする（入力中・詳細表示中は触らない）
      setInterval(() => {
        if (!$modal.hidden || document.hidden) return;
        if (state.view === 'list' && document.activeElement && document.activeElement.id === 'q') return;
        reload().then(render).catch(() => {});
      }, 60000);
    }).catch(e => {
      $app.innerHTML = '<p class="loading">読み込めませんでした。時間をおいて開き直してください。<br><small>' + esc(e.message) + '</small></p>';
    });
  }

  // ---------- 手元で開いたとき用のサンプル（Apps Script では使われない） ----------
  const Mock = (function () {
    const CONFIG = {
      title: '軽井沢ラーニングフェスティバル2026',
      days: [
        { date: '2026-11-12', label: '11/12(木)', start: '11:00', end: '23:00' },
        { date: '2026-11-13', label: '11/13(金)', start: '07:00', end: '23:00' },
        { date: '2026-11-14', label: '11/14(土)', start: '07:00', end: '15:00' },
      ],
      venues: ['SKY FIELD', 'SKY ARC', 'MOON BEAR', 'TAKIBI BASE', 'SAUNA RIVER', 'MORINO HIROBA -MOMI', 'MORINO HIROBA -MATSU', 'PODCAST STUDIO', 'その他'],
      fixed: [
        { date: '2026-11-12', start: '11:00', end: '13:00', title: '開場・受付', notSession: true },
        {
          date: '2026-11-12', start: '13:00', end: '14:00', title: 'オープニングセッション',
          host: 'ラーフェス実行委員会', venue: 'SKY FIELD',
          description: 'ラーフェスはいつもここからはじまる。\nくれぐれも遅れずにスカイフィールドに集まってね。',
          imageFile: 'opening.jpg',
        },
        {
          date: '2026-11-13', start: '15:30', end: '18:30', title: '芋煮でつながっていいとも！',
          host: '全日本芋煮会同好会アンディさん、藤田祐司さん、ラーフェス実行委員会', venue: 'SKY FIELD',
          description: '今年も魅力的な人がたくさん集まるラーフェス2026。心も身体もあたたまる「芋煮でつながっていいとも！」で、芋煮で出会ってつながって深めましょう。\n\nチームに入らなくなってしまうので、くれぐれも遅れずにご参加くださいね。',
        },
        {
          date: '2026-11-14', start: '13:00', end: '15:00', title: 'クロージングセッション',
          host: 'ラーフェス実行委員会', venue: 'SKY FIELD',
          description: 'ラーフェス2026 フィナーレ',
          imageFile: 'closing.jpg',
        },
      ],
      slotMinutes: 15,
      links: {
        guide: 'https://false-waterfall-52c.notion.site/2025-290d374796ea80329b9cc34a654a1672',
        facebook: 'https://www.facebook.com/groups/493722541052332/',
        website: 'https://learning-fest.jp/',
      },
    };
    const KEY = 'larfes-mock-v6';
    const T = '2026-10-16 18:00:00';
    const seed = [
      { id: 'S1', title: '焚き火を囲んで、問いを持ち寄る', host: 'サンプル主催A', date: '2026-11-12', start: '19:00', end: '20:30', venue: 'TAKIBI BASE', venueOther: '', description: '今年いちばん考えたことを1つ持ってきてください。', imageId: 'sample1', updatedAt: T },
      { id: 'S2', title: '朝の森を歩く', host: 'サンプル主催B', date: '2026-11-13', start: '07:00', end: '08:00', venue: 'MORINO HIROBA -MOMI', venueOther: '', description: '朝ごはん前に、森をゆっくり歩きます。歩きやすい靴で。', imageId: 'sample2', updatedAt: T },
      { id: 'S3', title: '子どもと作る、ダンボール秘密基地', host: 'サンプル主催C', date: '2026-11-13', start: '10:00', end: '12:00', venue: 'その他', venueOther: 'KIDS CAMP', description: 'ダンボールとガムテープで、大人も子どもも本気で作ります。', imageId: '', updatedAt: T },
      { id: 'S4', title: 'サウナと対話', host: 'サンプル主催D', date: '2026-11-13', start: '10:30', end: '11:30', venue: 'SAUNA RIVER', venueOther: '', description: 'ととのったあとの頭で、仕事の話をしてみる時間。', imageId: '', updatedAt: T },
      { id: 'S5', title: 'ふりかえりの技法', host: 'サンプル主催E', date: '2026-11-13', start: '10:00', end: '11:00', venue: 'SKY ARC', venueOther: '', description: '経験から学ぶための、ふりかえりのやり方を体験します。', imageId: '', updatedAt: T },
      { id: 'S6', title: '即興で学ぶリーダーシップ', host: 'サンプル主催F', date: '2026-11-13', start: '10:30', end: '12:00', venue: 'SKY ARC', venueOther: '', description: 'インプロ（即興劇）を使って、場を動かす感覚をつかみます。', imageId: 'sample3', updatedAt: T },
      { id: 'S7', title: '芝生でひらく、はじまりの対話', host: 'サンプル主催G', date: '2026-11-12', start: '14:30', end: '16:00', venue: 'SKY FIELD', venueOther: '', description: 'オープニングのあと、芝生に輪になって「ここで何をしたいか」を話します。', imageId: '', updatedAt: T },
      { id: 'S8', title: 'ポッドキャストで語る、小さな事業のつくり方', host: 'サンプル主催H', date: '2026-11-12', start: '16:30', end: '18:00', venue: 'PODCAST STUDIO', venueOther: '', description: '副業・スモールビジネスを始めた人の話を聞き、みんなで質問しあいます。', imageId: '', updatedAt: T },
      { id: 'S9', title: '星空の下で、ひとり時間', host: 'サンプル主催I', date: '2026-11-12', start: '21:00', end: '22:00', venue: 'MOON BEAR', venueOther: '', description: 'デッキで寝転んで星を見ます。しゃべらなくてOK。防寒具をお忘れなく。', imageId: '', updatedAt: T },
      { id: 'S11', title: '受付前で、朝のラジオ体操', host: 'サンプル主催K', date: '2026-11-14', start: '07:30', end: '08:00', venue: 'その他', venueOther: '受付前の広場', description: '最終日の朝、からだをほぐしてから始めましょう。', imageId: '', updatedAt: T },
      { id: 'S12', title: '最終日のふりかえり焚き火', host: 'サンプル主催L', date: '2026-11-14', start: '11:00', end: '12:30', venue: 'TAKIBI BASE', venueOther: '', description: '3日間で持ち帰りたいことを、ひとことずつ火にくべます。', imageId: '', updatedAt: T },
      { id: 'S13', title: '空を見上げるヨガ', host: 'サンプル主催M', date: '2026-11-14', start: '09:00', end: '10:00', venue: 'SKY FIELD', venueOther: '', description: 'ヨガマットは貸し出しあり。初めての人も歓迎です。', imageId: '', updatedAt: T },
    ];
    // サンプル用のテスト画像（assets/sample1〜3.jpg）
    const SAMPLE_IMAGES = { sample1: 'assets/sample1.jpg', sample2: 'assets/sample2.jpg', sample3: 'assets/sample3.jpg' };
    let images = {};
    function load() {
      try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); images = o.images || {}; return o.list; } } catch (e) {}
      return seed.slice();
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify({ list: list, images: images })); } catch (e) {} }
    let list = load();
    const stamp = () => new Date().toISOString().replace('T', ' ').slice(0, 19);
    const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 200));
    const fail = m => new Promise((_, rej) => setTimeout(() => rej(new Error(m)), 200));
    const putImage = data => { const id = 'IMG' + Date.now().toString(36); images[id] = data; return id; };
    const sorted = () => list.slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    return {
      getBootstrap: () => wait({ config: CONFIG, sessions: sorted(), baseUrl: location.href.split(/[?#]/)[0] }),
      getSessions: () => wait(sorted()),
      getImage: id => images[id] || SAMPLE_IMAGES[id] ? Promise.resolve(images[id] || SAMPLE_IMAGES[id]) : fail('画像が見つかりません。'),
      createSession: (d, imageData) => {
        const s = Object.assign({ id: 'S' + Date.now().toString(36) }, d, { imageId: imageData ? putImage(imageData) : '', updatedAt: stamp() });
        list.push(s); save();
        return wait(s);
      },
      updateSession: (id, d, imageData, base) => {
        const cur = list.find(s => s.id === id);
        if (!cur) return fail('このセッションは見つかりませんでした。すでに削除されたかもしれません。');
        if (base && cur.updatedAt !== base) return fail('ほかの人がこのセッションを先に直していました。画面を閉じて、もう一度開いてから直してください。');
        const next = Object.assign({}, cur, d, { updatedAt: stamp() });
        if (imageData) next.imageId = putImage(imageData);
        else if (imageData === '') next.imageId = '';
        list = list.map(s => s.id === id ? next : s); save();
        return wait(next);
      },
      deleteSession: id => {
        if (!list.find(s => s.id === id)) return fail('このセッションは見つかりませんでした。すでに削除されたかもしれません。');
        list = list.filter(s => s.id !== id); save(); return wait({ id: id });
      },
    };
  })();

  start();
})();
